<style>
  :root {
    --bg: #fff8ef;
    --surface: #ffffff;
    --ink: #2b2350;
    --muted: #6b6488;
    --line: #efe6d8;
    --purple: #6c4fd6;
    --orange: #ff8a3d;
    --yellow: #ffc93c;
    --green: #3cc47c;
    --sky: #4bb4f5;
    --pink: #ff6b9a;
    --shadow: 0 18px 40px -18px rgba(43, 35, 80, .35);
    --radius: 28px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.6;
    overflow-x: hidden;
  }
  h1, h2, h3 { font-family: "Baloo 2", "Nunito", sans-serif; line-height: 1.1; margin: 0; }
  a { color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  /* ---------- top bar ---------- */
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: "Baloo 2"; font-weight: 800; font-size: 1.5rem; text-decoration: none; }
  .brand svg { width: 42px; height: 42px; }
  .lang { display: flex; gap: 4px; background: var(--surface); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); }
  .lang button {
    border: 0; background: transparent; font: 700 .85rem "Nunito"; color: var(--muted);
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--purple); color: #fff; }

  /* ---------- hero business card ---------- */
  .hero { position: relative; padding: 24px 16px 64px; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(2px); opacity: .55; z-index: 0; }
  .blob.b1 { width: 260px; height: 260px; background: var(--yellow); top: -40px; right: -60px; }
  .blob.b2 { width: 180px; height: 180px; background: var(--sky); bottom: 10px; left: -70px; }
  .blob.b3 { width: 90px; height: 90px; background: var(--pink); top: 45%; right: 12%; }

  .card {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: 1.1fr .9fr;
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-main { padding: 44px 40px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    background: #f1ecff; color: var(--purple); font-weight: 700; font-size: .85rem;
    padding: 6px 14px; border-radius: 999px;
  }
  .card h1 { font-size: clamp(2.6rem, 7vw, 4.2rem); margin: 16px 0 6px; letter-spacing: -.5px; }
  .card h1 .i { color: var(--purple); } .card h1 .b { color: var(--orange); }
  .tagline { font-size: 1.15rem; color: var(--muted); margin: 0 0 24px; max-width: 34ch; }

  .contact-list { list-style: none; padding: 0; margin: 0 0 28px; display: grid; gap: 12px; }
  .contact-list li { display: flex; align-items: center; gap: 12px; font-weight: 600; }
  .ico {
    flex: none; width: 38px; height: 38px; border-radius: 12px;
    display: grid; place-items: center; color: #fff;
  }
  .ico svg { width: 20px; height: 20px; }
  .contact-list a { text-decoration: none; }
  .contact-list a:hover { text-decoration: underline; }
  .placeholder { color: var(--muted); font-style: italic; font-weight: 400; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    border: 0; border-radius: 999px; padding: 12px 20px;
    font: 700 1rem "Nunito"; text-decoration: none; transition: transform .15s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn svg { width: 18px; height: 18px; }
  .btn-primary { background: var(--purple); color: #fff; }
  .btn-wa { background: var(--green); color: #fff; }
  .btn-ghost { background: #fff3e6; color: var(--orange); }

  .card-art {
    position: relative; background: linear-gradient(160deg, var(--purple), #8f6cf0 55%, var(--sky));
    display: grid; place-items: center; min-height: 380px; overflow: hidden;
  }
  .card-art svg.scene { width: 88%; max-width: 380px; height: auto; }
  .stamp {
    position: absolute; top: 20px; right: 20px; background: var(--yellow); color: var(--ink);
    font: 800 .8rem "Baloo 2"; padding: 8px 12px; border-radius: 14px; transform: rotate(6deg);
  }

  /* ---------- sections ---------- */
  section { padding: 56px 0; }
  .sec-head { text-align: center; margin-bottom: 36px; }
  .sec-head h2 { font-size: clamp(2rem, 5vw, 2.7rem); }
  .sec-head p { color: var(--muted); margin: 8px auto 0; max-width: 56ch; }

  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .tile {
    background: var(--surface); border-radius: 22px; padding: 26px; box-shadow: var(--shadow);
    border-top: 6px solid var(--c, var(--purple));
  }
  .tile .emoji { font-size: 2rem; }
  .tile h3 { font-size: 1.35rem; margin: 10px 0 6px; }
  .tile p { margin: 0; color: var(--muted); }

  .groups { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .group { border-radius: 24px; padding: 28px; color: #fff; background: var(--c); position: relative; overflow: hidden; }
  .group::after { content: ""; position: absolute; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.15); right: -40px; bottom: -40px; }
  .group .age { font: 800 2.4rem "Baloo 2"; }
  .group h3 { font-size: 1.4rem; margin: 2px 0 8px; }
  .group p { margin: 0; opacity: .92; }

  .day { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; }
  .day ol { list-style: none; margin: 0; padding: 0; }
  .day li { display: grid; grid-template-columns: 110px 1fr; gap: 14px; align-items: center; padding: 14px 18px; border-bottom: 1px dashed var(--line); }
  .day li:last-child { border-bottom: 0; }
  .day time { font: 800 1.1rem "Baloo 2"; color: var(--purple); }

  .cta {
    background: var(--ink); color: #fff; border-radius: var(--radius); padding: 44px 36px;
    display: grid; grid-template-columns: 1.2fr 1fr; gap: 28px; align-items: center;
  }
  .cta h2 { font-size: clamp(1.9rem, 4.5vw, 2.5rem); }
  .cta p { color: #cfc9ec; margin: 10px 0 0; }
  .cta .actions { justify-content: flex-end; }
  .map {
    margin-top: 20px; border-radius: 22px; overflow: hidden; box-shadow: var(--shadow);
    aspect-ratio: 16 / 7; background: var(--line);
  }
  .map iframe { width: 100%; height: 100%; border: 0; display: block; }

  footer { padding: 36px 0 48px; text-align: center; color: var(--muted); font-size: .95rem; }
  footer .social { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; }

  @media (max-width: 820px) {
    .card, .cta { grid-template-columns: 1fr; }
    .card-art { min-height: 260px; order: -1; }
    .card-main { padding: 30px 22px; }
    .cta { padding: 32px 22px; }
    .cta .actions { justify-content: flex-start; }
    .day li { grid-template-columns: 80px 1fr; padding: 12px; }
    .map { aspect-ratio: 4 / 3; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .btn { transition: none; } }
</style>
</head>

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const telHref = (p) => "tel:" + p.replace(/[^\d+]/g, "");
const instaUrl = "https://www.instagram.com/" + CONFIG.instagram + "/";
const waUrl = CONFIG.whatsapp ? "https://wa.me/" + CONFIG.whatsapp : instaUrl;

function render(lang) {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));

  const ph = `<span class="placeholder">${esc(t.tbd)}</span>`;
  $("#c-phone").innerHTML = CONFIG.phone ? `<a href="${telHref(CONFIG.phone)}">${esc(CONFIG.phone)}</a>` : ph;
  $("#c-insta").innerHTML = `<a href="${instaUrl}" target="_blank" rel="noopener">@${esc(CONFIG.instagram)}</a>`;
  $("#c-address").innerHTML = CONFIG.address ? esc(CONFIG.address) : `${esc(t.city)} · ${ph}`;

  $("#features").innerHTML = t.features.map(([e, h, p, c]) =>
    `<div class="tile" style="--c:var(${c})"><div class="emoji">${e}</div><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("");
  $("#group-list").innerHTML = t.groups.map(([a, h, p, c]) =>
    `<div class="group" style="--c:var(${c})"><div class="age">${a}</div><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("");
  $("#day-list").innerHTML = t.day.map(([tm, x]) => `<li><time>${tm}</time><span>${esc(x)}</span></li>`).join("");

  try { localStorage.setItem("innobala-lang", lang); } catch (e) {}
}

// links
$("#btn-call").href = CONFIG.phone ? telHref(CONFIG.phone) : "#contact";
$("#btn-wa").href = $("#btn-wa2").href = waUrl;
$("#btn-insta").href = instaUrl;
$("#year").textContent = new Date().getFullYear();
$("#map").innerHTML = `<iframe title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
  src="https://www.google.com/maps?q=${encodeURIComponent(CONFIG.address || CONFIG.mapQuery)}&output=embed"></iframe>`;

// vCard download
$("#btn-vcard").addEventListener("click", () => {
  const lines = ["BEGIN:VCARD", "VERSION:3.0", "FN:Innobala Kindergarten", "ORG:Innobala",
    CONFIG.phone && "TEL;TYPE=WORK:" + CONFIG.phone.replace(/\s/g, ""),
    CONFIG.address && "ADR;TYPE=WORK:;;" + CONFIG.address + ";;;;",
    "URL:" + instaUrl, "END:VCARD"].filter(Boolean);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\r\n")], { type: "text/vcard" }));
  a.download = "innobala.vcf";
  a.click();
  URL.revokeObjectURL(a.href);
});

document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => render(b.dataset.lang)));
let saved = "az";
try { saved = localStorage.getItem("innobala-lang") || "az"; } catch (e) {}
render(T[saved] ? saved : "az");
</script>
